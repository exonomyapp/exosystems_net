[package]
edition = "2021"
name = "leptos-forms-rs"
version = "1.3.0"
authors = ["Cloud Shuttle <info@cloudshuttle.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "🚀 Type-safe, reactive form handling library for Leptos applications. Production-ready with 100% test success rate, cross-browser compatibility, and comprehensive validation. Built with Rust/WASM for high performance."
homepage = "https://github.com/cloud-shuttle/leptos-forms-rs"
documentation = "https://docs.rs/leptos-forms-rs"
readme = "README.md"
keywords = [
    "leptos",
    "forms",
    "validation",
    "web",
    "wasm",
]
categories = [
    "web-programming",
    "wasm",
]
license = "MIT"
repository = "https://github.com/cloud-shuttle/leptos-forms-rs"

[features]
csr = ["leptos/csr"]
default = ["csr"]
hydrate = ["leptos/hydrate"]
minimal = ["wasm-opt"]
ssr = ["leptos/ssr"]
wasm-opt = []

[lib]
name = "leptos_forms_rs"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

[[test]]
name = "leptos_compatibility_tests"
path = "tests/leptos_compatibility_tests.rs"

[[test]]
name = "wasm_basic_test"
path = "tests/wasm_basic_test.rs"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.console_error_panic_hook]
version = "0.1"

[dependencies.console_log]
version = "1.0"

[dependencies.gloo-net]
version = "0.5"

[dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[dependencies.js-sys]
version = "0.3"

[dependencies.lazy_static]
version = "1.4"

[dependencies.leptos]
version = "0.8"
features = ["csr"]

[dependencies.leptos-forms-rs-macro]
version = "1.3.0"

[dependencies.log]
version = "0.4"

[dependencies.regex]
version = "1.0"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.wasm-bindgen]
version = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Storage",
    "Performance",
    "HtmlElement",
    "Event",
    "EventTarget",
    "Document",
]

[dev-dependencies.wasm-bindgen-test]
version = "0.3"

[profile.release]
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
opt-level = "s"
codegen-units = 1
panic = "abort"
inherits = "release"
strip = "debuginfo"
