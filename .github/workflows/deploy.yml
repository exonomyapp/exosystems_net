name: Build and deploy exosystems.net

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fitness checks
        run: bash scripts/fitness.sh

  build:
    needs: fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos prebuilt
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos
      - name: Install sass
        run: sudo apt-get update && sudo apt-get install -y sassc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo leptos build --release
      - name: Pack artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p deploy/site
          cp target/release/exosystems_net deploy/exosystems_net-ssr
          cp -r target/site/* deploy/site/
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: deploy

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: deploy
      - name: Copy to host and restart
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "deploy/*"
          target: "/opt/exosystems_net/incoming"
      - name: Activate on host
        uses: appleboy/ssh-action@v1.0.3
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MODEL_UPDATES_DASH_KEY: ${{ secrets.MODEL_UPDATES_DASH_KEY }}
          OWNER_DID: ${{ secrets.OWNER_DID }}
          NODE_DID: ${{ secrets.NODE_DID }}
          NODE_SECRET: ${{ secrets.NODE_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: HOSTINGER_API_TOKEN,TENCENTCLOUD_SECRET_ID,TENCENTCLOUD_SECRET_KEY,BREVO_SMTP_LOGIN,BREVO_SMTP_KEY,BREVO_API_KEY,MODEL_UPDATES_DASH_KEY,OWNER_DID,NODE_DID,NODE_SECRET
          script: |
            set -e
            mkdir -p /opt/exosystems_net/bin /opt/exosystems_net/site
            umask 022
            cat > /opt/exosystems_net/env <<EOF
            LEPTOS_SITE_ROOT=/opt/exosystems_net/site
            LEPTOS_SITE_ADDR=127.0.0.1:3000
            LEPTOS_OUTPUT_NAME=exosystems_net
            LEPTOS_SITE_PKG_DIR=pkg
            MODEL_UPDATES_STORE=http://127.0.0.1:8080
            MODEL_UPDATES_DASH_KEY='${MODEL_UPDATES_DASH_KEY}'
            OWNER_DID='${OWNER_DID}'
            NODE_DID='${NODE_DID}'
            NODE_SECRET='${NODE_SECRET}'
            BREVO_SMTP_LOGIN='${BREVO_SMTP_LOGIN}'
            BREVO_SMTP_KEY='${BREVO_SMTP_KEY}'
            BREVO_API_KEY='${BREVO_API_KEY}'
            RUST_BACKTRACE=1
            EOF
            chmod 600 /opt/exosystems_net/env
            cat > /opt/exosystems_net/secrets.env <<EOF
            HOSTINGER_API_TOKEN='${HOSTINGER_API_TOKEN}'
            TENCENTCLOUD_SECRET_ID='${TENCENTCLOUD_SECRET_ID}'
            TENCENTCLOUD_SECRET_KEY='${TENCENTCLOUD_SECRET_KEY}'
            BREVO_SMTP_LOGIN='${BREVO_SMTP_LOGIN}'
            BREVO_SMTP_KEY='${BREVO_SMTP_KEY}'
            BREVO_API_KEY='${BREVO_API_KEY}'
            EOF
            chmod 600 /opt/exosystems_net/secrets.env
            grep -q 'exosystems_net/secrets.env' /root/.bashrc 2>/dev/null || cat >> /root/.bashrc <<'RC'
            # Operator credentials for managing Exosystems resources
            if [ -f /opt/exosystems_net/secrets.env ]; then set -a; . /opt/exosystems_net/secrets.env; set +a; fi
            RC
            systemctl stop exosystems-net || true
            cp /opt/exosystems_net/incoming/deploy/exosystems_net-ssr /opt/exosystems_net/bin/exosystems_net-ssr
            chmod +x /opt/exosystems_net/bin/exosystems_net-ssr
            rm -rf /opt/exosystems_net/site/pkg
            cp -r /opt/exosystems_net/incoming/deploy/site/* /opt/exosystems_net/site/
            chmod -R a+rX /opt/exosystems_net/site
            cat > /etc/systemd/system/exosystems-net.service <<'UNIT'
            [Unit]
            Description=ExoSystems.net Leptos site
            After=network.target
            [Service]
            Type=simple
            WorkingDirectory=/opt/exosystems_net
            EnvironmentFile=/opt/exosystems_net/env
            ExecStart=/opt/exosystems_net/bin/exosystems_net-ssr
            Restart=always
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable exosystems-net
            systemctl restart exosystems-net
            sleep 5
            curl -sf http://127.0.0.1:3000/ | head -c 200
            echo "DEPLOY-OK"
            curl -sf -o /dev/null http://127.0.0.1:3000/pkg/exosystems_net.css
            curl -sf -o /dev/null http://127.0.0.1:3000/pkg/exosystems_net.wasm
            echo "ASSETS-OK"
            # The front door comes from the repository. Each configuration
            # file is copied into place, tested, and only then loaded; a file
            # that fails the test is put back the way it was.
            for NAME in exosystems.conf models.conf exonovel.conf; do
              SRC=/opt/exosystems_net/incoming/deploy/nginx/$NAME
              DST=/etc/nginx/conf.d/$NAME
              if [ -f "$DST" ]; then cp -a "$DST" "$DST.bak.$(date +%Y%m%d%H%M%S)"; fi
              install -m 644 "$SRC" "$DST"
            done
            if ! nginx -t; then
              for NAME in exosystems.conf models.conf exonovel.conf; do
                DST=/etc/nginx/conf.d/$NAME
                BAK=$(ls -t "$DST".bak.* 2>/dev/null | head -1)
                if [ -n "$BAK" ]; then cp -a "$BAK" "$DST"; fi
              done
              nginx -t
              echo "NGINX-CONFIG-REJECTED"
              exit 1
            fi
            systemctl reload nginx
            echo "NGINX-OK"
