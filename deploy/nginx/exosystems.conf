server {
    listen 80;
    server_name exosystems.net www.exosystems.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exosystems.net www.exosystems.net;
    ssl_certificate /etc/letsencrypt/live/exosystems.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exosystems.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location = /docs/harden.md {
        alias /docs/harden.md;
        default_type text/plain;
        charset utf-8;
    }
    location /pkg/ {
        proxy_pass http://127.0.0.1:52415;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:52415;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:52415;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /store/ {
        rewrite ^/store/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:52417;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:52415;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
