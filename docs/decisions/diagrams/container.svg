    <text x="650" y="112" font-size="14" letter-spacing="3">CONSCIA NODE — PLAIN</text>
    <text x="60" y="156" font-size="13.5">1 · SERVER PAGES</text>
    <text x="60" y="288" font-size="13.5">2 · BROWSER BUNDLE</text>
    <text x="60" y="420" font-size="13.5">3 · WILLOW STORE</text>
    <text x="60" y="552" font-size="13.5">4 · SESSION + STORE</text>
    <text x="322" y="156" font-size="13.5">6 · DOCS (GATED)</text>
    <text x="322" y="288" font-size="13.5">7 · PROFILE PAGE</text>
    <text x="322" y="420" font-size="13.5">5 · SIGN-IN GATE</text>
    <text x="662" y="156" font-size="13.5">8 · CONSCIRE ENDPOINT</text>
    <text x="662" y="304" font-size="13.5">9 · WILLOW NAMESPACES</text>
    <text x="662" y="460" font-size="13.5">10 · SQLITE STATE</text>
    <text x="60" y="176" font-size="11" font-family="'Courier New', monospace">renders per-user HTML</text>
    <text x="60" y="308" font-size="11" font-family="'Courier New', monospace">hydrates, animates only</text>
    <text x="60" y="440" font-size="11" font-family="'Courier New', monospace">public · shared · private</text>
    <text x="60" y="572" font-size="11" font-family="'Courier New', monospace">tickets, delegations</text>
    <text x="322" y="176" font-size="11" font-family="'Courier New', monospace">reads store 3 only</text>
    <text x="322" y="308" font-size="11" font-family="'Courier New', monospace">relay list, bundle export</text>
    <text x="322" y="440" font-size="11" font-family="'Courier New', monospace">present or generate did</text>
    <text x="662" y="176" font-size="11" font-family="'Courier New', monospace">owner-approved joins</text>
    <text x="662" y="324" font-size="11" font-family="'Courier New', monospace">encrypted, content-addressed</text>
    <text x="662" y="480" font-size="11" font-family="'Courier New', monospace">conscired identities, caps</text>
