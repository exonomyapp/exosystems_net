    <text x="874" y="404" font-size="11.5" font-style="italic">indexes</text>
    <text x="44" y="768" font-size="12" letter-spacing="1">DWG C4-02 — Container plan: sheet 2 of the C4 set (Context, Containers, Components, Code).</text>
    <text x="44" y="788" font-size="11">Shows the ten inner containers: seven in the site application, three in the conscia node.</text>
