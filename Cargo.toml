[package]
name = "exosystems_net"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.20" }
leptos_router = { version = "0.8.6" }
leptos_meta = { version = "0.8.5" }
axum = { version = "0.8.9", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
radix-leptos = { version = "=0.9.0" }
leptos-forms-rs = { version = "=1.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
bs58 = { version = "0.5" }
rand = { version = "0.8" }
web-sys = { version = "0.3", features = ["Window", "Storage"] }
exocore = { path = "../exotalk/exoengine/exocore", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

# Vendored one-line fix: upstream form_errors.rs fails type inference
# under the ssr+hydrate feature set. Re-check every upstream release.
# Vendored radix trio: upstream forces leptos "ssr" on every target, which
# poisons the browser bundle (tachys skips client wiring with its ssr flag
# on; the first click then kills the app). Fixed the same way: keep "csr",
# let ssr/hydrate arrive via each crate's own features below.
# Re-check every upstream release; drop vendor/radix-* when fixed upstream.
[patch.crates-io]
leptos-forms-rs = { path = "vendor/leptos-forms-rs" }
radix-leptos = { path = "vendor/radix-leptos" }
radix-leptos-core = { path = "vendor/radix-leptos-core" }
radix-leptos-primitives = { path = "vendor/radix-leptos-primitives" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
hydrate = [
    "leptos/hydrate",
    "radix-leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:reqwest",
    "dep:exocore",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "radix-leptos/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "exosystems_net"
bin-features = ["ssr"]
lib-features = ["hydrate"]
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "assets"
site-addr = "127.0.0.1:3000"
reload-port = 3001
